name: llm_proxy
description: "LLM Proxy - 本地 LLM API 代理工具，支持规则配置与参数注入"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9
  shared_preferences: 2.5.5
  intl: 0.20.2
  path_provider: 2.1.5
  path: 1.9.1
  window_manager: 0.5.1
  tray_manager: 0.5.2

  # Riverpod 状态管理
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2

  # GoRouter 声明式路由
  go_router: 17.2.3

  # Freezed 不可变模型 + JSON 序列化
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # Drift 数据库
  drift: 2.33.0
  sqlite3_flutter_libs: 0.6.0+eol
  sqlite3: 3.3.1
  file_picker: 11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

  # 代码生成：Riverpod
  riverpod_generator: 4.0.3
  # 代码生成：Freezed + JSON
  freezed: 3.2.5
  json_serializable: 6.14.0
  # 代码生成：Drift
  drift_dev: 2.33.0
  # 代码生成运行器
  build_runner: 2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/

dependency_overrides:
  analyzer: 10.0.1
  dart_style: 3.1.7
